[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "solfer"
version = "1.0.0"
description = "Tonic solfa notation editor with audio playback and export"
readme = "README.md"
requires-python = "==3.11"
license = { text = "All rights reserved" }

dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-limiter==4.1.1",
    "flask-wtf==1.3.0",
    "flask-login>=0.6",
    "werkzeug>=3.0",
    "authlib>=1.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy==2.2.6",
    "gunicorn",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",   # swap for psycopg2 (no -binary) in production builds
]
redis = [
    "redis>=5.0",             # required by flask-limiter when using redis:// storage
]
payments = [
    "apscheduler>=3.10",      # transfer payment polling worker
]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
]
all = [
    "solfer[postgres,redis,payments,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]